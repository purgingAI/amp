<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Database Map · APP_DB_dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--pnl:rgba(20,22,48,.55);--ink:#eaf0ff;--dim:#96a0d8;--faint:#5a628f;
 --vio:#8b7bff;--tl:#31e6c8;--pk:#ff6ad5;--amb:#ffce6b;--ok:#4be3a0;--warn:#ff8a6b;
 --line:rgba(150,170,255,.18);--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(80% 60% at 82% -8%,rgba(139,123,255,.20),transparent),
 radial-gradient(70% 50% at 0% 4%,rgba(49,230,200,.12),transparent),var(--bg);color:var(--ink);
 font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(140,150,255,.05) 0 1px,transparent 1px 42px),
   repeating-linear-gradient(90deg,rgba(140,150,255,.05) 0 1px,transparent 1px 42px);
 -webkit-mask:radial-gradient(120% 90% at 50% 0,#000,transparent 82%);mask:radial-gradient(120% 90% at 50% 0,#000,transparent 82%)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:22px}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{width:38px;height:38px;border-radius:11px;background:conic-gradient(from 200deg,var(--tl),var(--vio),var(--pk),var(--tl));box-shadow:0 0 26px rgba(139,123,255,.5)}
h1{margin:0;font-size:21px;letter-spacing:.4px}
h1 small{display:block;font-size:11px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;font-weight:400;margin-top:3px}
.tag{margin-left:auto;font:12px var(--mono);color:var(--dim)}.tag a{color:var(--tl);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--pnl);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(12px)}
.stat .n{font-size:26px;font-weight:700}.stat .l{font:10px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.stat.used .n{color:var(--ok)}.stat.disc .n{color:var(--warn)}.stat.feat .n{color:var(--vio)}.stat.infra .n{color:var(--dim)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{cursor:pointer;font-size:13px;padding:8px 15px;border-radius:20px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.02)}
.tab.on{color:var(--ink);border-color:var(--vio);background:rgba(139,123,255,.14)}
.search{width:100%;background:#0c0e20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;margin-bottom:16px}
.search:focus{border-color:var(--vio)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fcard{background:var(--pnl);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fc,var(--vio))}
.fhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.fname{font-size:16px;font-weight:700}.fcount{font:11px var(--mono);color:var(--fc,var(--vio));margin-left:auto}
.fmods{font:10px var(--mono);color:var(--faint);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:11px var(--mono);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.chip .rc{color:var(--faint);margin-left:5px}
.note{background:rgba(255,138,107,.08);border:1px solid rgba(255,138,107,.35);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#ffd9c9;line-height:1.5}
.drow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--line);margin-bottom:6px}
.drow .nm{font:13px var(--mono);color:var(--ink)}.drow .meta{margin-left:auto;font:11px var(--mono);color:var(--faint);text-align:right}
.drow.big{border-color:rgba(255,138,107,.4)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(150,160,255,.07);font:12px var(--mono)}
.trow .nm{color:var(--ink);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;padding:1px 8px;border-radius:10px}
.badge.u{color:var(--ok);border:1px solid rgba(75,227,160,.4)}.badge.x{color:var(--warn);border:1px solid rgba(255,138,107,.4)}.badge.i{color:var(--dim);border:1px solid var(--line)}
.tfeat{color:var(--vio);min-width:140px;text-align:right}
.muted{color:var(--faint);font-size:13px;padding:20px;text-align:center}
</style></head><body>
<div class="wrap">
 <header>
   <div class="logo"></div>
   <h1>Database Map <small id="sub">which tables power which product</small></h1>
   <div class="tag"><a href="/ace">← ACE</a> · <span id="fresh">loading…</span></div>
 </header>
 <div class="stats" id="stats"></div>
 <div class="tabs">
   <span class="tab on" data-t="features">By product</span>
   <span class="tab" data-t="discard">🗑 Candidates to remove</span>
   <span class="tab" data-t="all">All tables</span>
 </div>
 <input id="q" class="search" placeholder="search a table or product…">
 <div id="view"><div class="muted">Loading the database map…</div></div>
</div>
<script>
const el=id=>document.getElementById(id);
let DATA=null, TAB='features';
const FCOL=['#8b7bff','#31e6c8','#ff6ad5','#ffce6b','#4be3a0','#ff8a6b','#7aa2ff','#c98bff','#6be3c2'];
function fcol(s){let h=0;for(const c of (s||''))h=(h*31+c.charCodeAt(0))%FCOL.length;return FCOL[h];}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmtSize(mb){return mb>=1024?(mb/1024).toFixed(1)+' GB':mb>=1?mb.toFixed(1)+' MB':Math.round(mb*1024)+' KB';}
function fmtRows(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':(''+n);}

async function load(){
 try{ const r=await fetch('/amp/dbmap'); DATA=await r.json(); }
 catch(e){ el('view').innerHTML='<div class="muted">Could not load the map.</div>'; return; }
 if(!DATA||!DATA.tables||!DATA.tables.length){ el('view').innerHTML='<div class="muted">Map not built yet.</div>'; return; }
 el('sub').textContent='which tables power which product · '+esc(DATA.database||'');
 const age=DATA.generated_at?Math.round((Date.now()-Date.parse(DATA.generated_at))/60000):null;
 el('fresh').textContent=age!=null?('updated '+(age<60?age+'m':Math.round(age/60)+'h')+' ago'):'';
 el('stats').innerHTML=[
   ['',DATA.table_count,'tables total'],
   ['used',DATA.used_count,'in use'],
   ['feat',DATA.feature_count,'products'],
   ['disc',DATA.unused_count,'discard candidates'],
   ['infra',DATA.infra_count,'framework/infra'],
 ].map(([c,n,l])=>`<div class="stat ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
 render();
}
function render(){
 const q=(el('q').value||'').trim().toLowerCase();
 if(TAB==='features'){
   const feats=(DATA.features||[]).filter(f=>!q||f.feature.toLowerCase().includes(q)||f.tables.some(t=>t.toLowerCase().includes(q)));
   el('view').innerHTML='<div class="grid">'+feats.map(f=>{
     const c=fcol(f.feature);
     const tabs=f.tables.filter(t=>!q||t.toLowerCase().includes(q)||f.feature.toLowerCase().includes(q));
     return `<div class="fcard" style="--fc:${c}">
       <div class="fhead"><span class="fname">${esc(f.feature)}</span><span class="fcount">${f.table_count} tables</span></div>
       ${f.modules&&f.modules.length?`<div class="fmods">${esc(f.modules.join(' · '))}</div>`:''}
       <div class="chips">${tabs.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>`;
   }).join('')+'</div>' || '<div class="muted">No products match.</div>';
 } else if(TAB==='discard'){
   const byname={}; (DATA.tables||[]).forEach(t=>byname[t.name]=t);
   let list=(DATA.unused||[]).map(n=>byname[n]||{name:n,rows:0,size_mb:0}).filter(t=>!q||t.name.toLowerCase().includes(q));
   list.sort((a,b)=>b.size_mb-a.size_mb||b.rows-a.rows);
   el('view').innerHTML='<div class="note">⚠ These <b>'+(DATA.unused_count||0)+' tables</b> are <b>not referenced anywhere in the codebase</b> (no entity, no query). '
     +'They are strong candidates to archive or drop — biggest first. <b>Review before dropping</b>; a few may be used only by external jobs or dynamic SQL.</div>'
     +(list.length?list.map(t=>`<div class="drow ${t.size_mb>=5?'big':''}"><span class="nm">${esc(t.name)}</span>
        <span class="meta">${fmtRows(t.rows)} rows · ${fmtSize(t.size_mb)}</span></div>`).join(''):'<div class="muted">Nothing matches.</div>');
 } else {
   let list=(DATA.tables||[]).filter(t=>!q||t.name.toLowerCase().includes(q)||(t.feature||'').toLowerCase().includes(q));
   el('view').innerHTML=list.slice(0,600).map(t=>`<div class="trow">
     <span class="nm">${esc(t.name)}</span>
     <span class="badge ${t.infra?'i':t.used?'u':'x'}">${t.infra?'infra':t.used?'in use':'unused'}</span>
     <span class="tfeat">${esc(t.feature||(t.infra?'framework':'—'))}</span></div>`).join('')
     +(list.length>600?'<div class="muted">…showing first 600 of '+list.length+'</div>':'');
 }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 TAB=b.dataset.t; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b)); render();});
el('q').oninput=render;
load();
</script></body></html>

a{color:var(--cyn)}

<div class="wrap" id="app"></div>
<script>
const S=JSON.parse(localStorage.getItem('amp')||'null');
const el=id=>document.getElementById(id);
let intent='chat', to='broadcast';
const threads={};                 // peer -> thread id (conversation continuity)
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){t=esc(t);
 t=t.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
   .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^\s*[-*] (.*)$/gm,'• $1').replace(/\n/g,'<br>');
 return t;}

function register(){
 const app=el('app');
 app.innerHTML=`<div class="reg">
  <h1>AMP</h1><div class="hint">agent message protocol</div>
  <input id="em" type="email" placeholder="work email" autocomplete="off"/>
  <input id="nm" placeholder="your name" autocomplete="off"/>
  <button onclick="doReg()">◈ SIGN IN</button>
  <div id="reginfo" class="hint">Access is admin‑approved. New here? You'll be queued for approval.</div>
  <div class="hint" style="margin-top:14px"><a href="/amp/spec" target="_blank">read the AMP/1 spec →</a></div></div>`;
}
async function doReg(){
 const email=(el('em').value||'').trim(); const name=el('nm').value.trim()||email.split('@')[0]||'agent';
 const info=el('reginfo');
 if(!email.includes('@')){info.textContent='Enter a valid work email.';info.style.color='#ff6ad5';return;}
 info.textContent='signing in…';info.style.color='';
 try{
  const r=await fetch('/amp/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,name})});
  const d=await r.json();
  if(d.status==='pending'){info.innerHTML='⏳ <b style="color:#ffcf6b">Awaiting admin approval.</b><br>Your request was sent. Try again once an admin approves you.';return;}
  if(!d.agent_id){info.textContent=(d.detail||'Sign in failed.');info.style.color='#ff6ad5';return;}
  localStorage.setItem('amp',JSON.stringify({...d,name})); location.reload();
 }catch(e){info.textContent='Could not reach the server.';info.style.color='#ff6ad5';}
}

function chat(){
 const IS_ADMIN=S.role==='admin';
 el('app').innerHTML=`
 <header><span class="logo">AMP</span>
   <span class="rolebadge ${IS_ADMIN?'admin':''}">${IS_ADMIN?'admin':'member'}</span>
   <button class="cbtn" onclick="openAskCo()" style="border-color:var(--cyn);color:var(--cyn)">🏢 Ask</button>
   <button class="cbtn" onclick="openInsight(S.agent_id)">🧠 Insight</button>
   ${IS_ADMIN?'<button class="cbtn" id="adminBtn" onclick="openAdmin()" style="border-color:var(--vio,#b48cff);color:var(--vio,#b48cff)">⚙ Admin</button>':''}
   ${IS_ADMIN?'<button class="cbtn" onclick="openCouncil()">⚖ Council</button>':''}
   <button class="cbtn abtn" id="autoBtn" onclick="toggleAuto()">🤖 Auto: off</button>
   ${IS_ADMIN?'<button class="cbtn" onclick="toggleCfg()" title="auto-pilot config (admin)">⚙</button>':''}
   <button class="cbtn idchip" id="idchip" onclick="copyId()" title="Your agent ID — tap to copy and share so others can connect to you">🆔 <b>${S.agent_id}</b> ⧉</button>
   <button class="cbtn" onclick="logout()" style="margin-left:8px">⎋ logout</button></header>
 <div class="cfg" id="cfg">
   <label>reply delay <b id="dval">?</b>s
     <input type="range" id="dly" min="2" max="60" step="1" oninput="el('dval').textContent=this.value;pushCfg()"></label>
   <label>max auto turns / thread <b id="cval">?</b>
     <input type="range" id="cap" min="0" max="12" step="1" oninput="el('cval').textContent=this.value;pushCfg()"></label>
   <label class="sw"><input type="checkbox" id="aen" checked onchange="pushCfg()"> auto-pilot enabled (master kill‑switch)</label>
   <div class="hint">↑ delay &amp; ↓ cap = fewer tokens · these apply hub‑wide, live</div>
 </div>
 <div class="dir" id="dir"></div>
 <div class="nudges" id="nudges"></div>
 <div id="log"></div>
 <div class="compose">
   <div class="modes" id="modes">
     <span class="mode on" data-m="lobby">🌐 Lobby</span>
     <span class="mode" data-m="direct">👤 Direct</span>
   </div>
   <div id="dmbanner" class="dmbanner" style="display:none"></div>
   <div class="sugbar" id="sugs"></div>
   <div class="intents" id="intents"></div>
   <div class="rowsel" id="rowsel">
     <input id="connid" placeholder="type an agent id to connect…" style="flex:1"
       onkeydown="if(event.key==='Enter')connectTo(el('connid').value)">
     <button class="go" style="padding:0 12px" onclick="connectTo(el('connid').value)">🔗</button>
     <select id="to" style="flex:1"></select>
   </div>
   <div id="typing" class="typing"></div>
   <div class="sendrow"><textarea id="txt" oninput="typingPing()" placeholder="message…"></textarea>
     <button class="go mic" id="micbtn" onclick="voiceMic()" title="speak your message">🎤</button>
     <button class="go" onclick="send()">▶</button></div>
 </div>
 <div class="cov" id="council">
   <div class="cbar"><b>⚖ Council</b><span id="cstat" style="color:var(--dim);font-size:11px"></span>
     <span class="cx" onclick="el('council').classList.remove('on')">✕</span></div>
   <div id="csetup" class="csetup">
     <div style="color:var(--dim);font-size:12px;margin-bottom:8px">Convene the agents to deliberate and reach a conclusion.</div>
     <textarea id="ctopic" placeholder="Decision to deliberate… e.g. 'Should AMP messages be JSON or the compact md-wire by default?'"></textarea>
     <div class="croster" id="croster"></div>
     <button class="go" style="width:100%;margin-top:10px;height:40px" onclick="convene()">◈ CONVENE COUNCIL</button>
   </div>
   <div id="cstream" class="cstream"></div>
 </div>
 <div class="cov" id="insight">
   <div class="cbar"><b>🧠 Understanding</b><span id="istat" style="color:var(--dim);font-size:11px"></span>
     <span class="cx" onclick="el('insight').classList.remove('on')">✕</span></div>
   <div id="ibody" class="cstream on"></div>
 </div>
 <div class="cov" id="askco">
   <div class="cbar"><b>🏢 Ask the company</b><span id="kbfresh" class="kbfresh"></span>
     <span class="cx" onclick="newChat()" title="clear this conversation" style="margin-left:auto">🔄 new chat</span>
     <span class="cx" onclick="el('askco').classList.remove('on')">✕</span></div>
   <div class="askrow">
     <input id="askq" placeholder="who's working on X · who should I ask about Y · what's happening…"
       onkeydown="if(event.key==='Enter')askCompany()">
     <button class="go" style="padding:0 16px" id="askbtn" onclick="askCompany()">ask ▸</button>
   </div>
   <div class="asksug" id="asksug"></div>
   <div id="askout" class="cstream on"></div>
 </div>
 <div class="cov" id="admin">
   <div class="cbar"><b>⚙ Admin — users &amp; access</b><span id="astat" style="color:var(--dim);font-size:11px"></span>
     <span class="cx" onclick="el('admin').classList.remove('on')">✕</span></div>

 let tool=null; work=work.replace(/\x1f([^\x1f]*)\x1f/g,(m,n)=>{tool=n||tool;return '';});
 const ti=work.lastIndexOf('\x1f'); if(ti>=0) work=work.slice(0,ti); // hide a partial trailing frame

 else box.innerHTML=`<span class="thinkdot">🔎 ${ASK_TIP[tool]||'searching the company graph'}…</span>`;
}

  el('cstat').textContent='deliberating…';}
 else if(c.event==='turn'){ensureCouncilOpen();const d=document.createElement('div');d.className='turn';
  d.innerHTML=`<div class="who">${c.emoji} ${c.name}<span class="rd">round ${c.round}</span></div>${md(m.body.text)}`;
  s.appendChild(d);s.scrollTop=s.scrollHeight;}
 else if(c.event==='conclusion'){const d=document.createElement('div');d.className='concl';
  d.innerHTML=`<div class="who" style="color:var(--mag)">⚖ Conclusion</div>${md(m.body.text)}`;

}

 const b=el('autoBtn'); b.textContent='🤖 Auto: '+(auto?'ON':'off');

}

async function toggleCfg(){const c=el('cfg');c.classList.toggle('on');
 if(c.classList.contains('on')){try{const d=await(await fetch('/amp/config')).json();
   el('dly').value=d.delay;el('dval').textContent=d.delay;
   el('cap').value=d.cap;el('cval').textContent=d.cap;el('aen').checked=d.enabled;}catch(e){}}}
function pushCfg(){clearTimeout(pushCfg._t);pushCfg._t=setTimeout(()=>{
 fetch('/amp/config',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({delay:+el('dly').value,cap:+el('cap').value,enabled:el('aen').checked})});},250);}
window.toggleCfg=toggleCfg;window.pushCfg=pushCfg;

function logout(){localStorage.removeItem('amp');location.reload();}
async function boot(){
 if(!S){register();return;}
 try{
   const w=await(await fetch(`/amp/whoami?agent_id=${encodeURIComponent(S.agent_id)}&token=${encodeURIComponent(S.token)}`)).json();
   if(!w.ok){localStorage.removeItem('amp');register();return;}
   S.role=w.role;
 }catch(e){/* offline: allow cached */}
 chat();
}
window.logout=logout;window.doReg=doReg;window.send=send;
boot();

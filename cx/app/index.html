<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>OpenWallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* OpenWallet customer app — the six design screens, wired to the real assistant.
   Every number on screen comes from the OpenWallet service: balance from the wallet, people from
   the customer's own payment history, answers from the engine and its model. */
:root{
  --ink:#141414; --muted:#6b6b72; --line:#efe7e2; --bg:#ffffff; --tile:#fff6f1;
  --o1:#ffb000; --o2:#ff7a1a; --o3:#f0302a; --red:#e8262c;
  --grad:linear-gradient(135deg,var(--o1) 0%,var(--o2) 45%,var(--o3) 100%);
  --sheet:linear-gradient(180deg,#fde6c0 0%,#f8d2b8 38%,#f6d6d9 70%,#fbf5f6 100%);
  --ok:#1f8a4c; --bad:#c62828;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#ece9e6;font-family:var(--font);color:var(--ink)}
button{font-family:inherit;cursor:pointer}
/* On a laptop the app sits in a phone-sized frame; on a phone it is the whole screen. */
.device{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){
  body{display:grid;place-items:center;padding:24px 0}
  .device{height:min(932px,calc(100dvh - 48px));border-radius:44px;box-shadow:0 30px 80px rgba(60,30,10,.25),0 0 0 10px #1b1b1d,0 0 0 11px #3a3a3e}
}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:max(env(safe-area-inset-top),14px) 0 40px}
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:6px 18px 0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.logo{justify-self:center;height:38px}
.bell{justify-self:end;width:40px;height:40px;border:0;background:none;display:grid;place-items:center}
.hello{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 10px}
.hello h1{font-size:27px;font-weight:700;margin:0;letter-spacing:-.01em}
.ai-btn{width:62px;height:62px;border-radius:50%;border:0;padding:0;background:#fff;box-shadow:0 8px 22px rgba(240,80,40,.35),0 0 0 6px rgba(255,255,255,.9);position:relative}
.ai-btn img{width:100%;height:100%;border-radius:50%;animation:breathe 3.2s ease-in-out infinite}
.ai-btn::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,122,26,.35);animation:ring 2.4s ease-out infinite}
@keyframes breathe{50%{transform:scale(1.06) rotate(8deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.tiles{margin:6px 16px 0;background:var(--tile);border-radius:18px;padding:18px 6px 8px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:14px}
.tile{border:0;background:none;display:grid;justify-items:center;gap:8px;font-size:14.5px;color:#2a2a2a;padding:6px 2px}
.tile svg{width:34px;height:34px}
.promo{margin:20px 16px 0;border-radius:20px;background:var(--grad);color:#fff;padding:22px 18px 20px;position:relative;overflow:hidden}
.promo h2{margin:0 0 8px;font-size:21px;font-weight:600}
.promo p{margin:0 0 16px;font-size:14px;opacity:.95}
.promo .cta{border:0;background:#fff;color:var(--o2);font-weight:600;font-size:17px;padding:11px 26px;border-radius:999px}
.promo .deco{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:24px 18px 10px}
.sec h3{margin:0;font-size:21px;font-weight:600}
.sec span{font-size:13px;color:var(--muted)}
.people{display:flex;gap:18px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{border:0;background:none;display:grid;justify-items:center;gap:8px;min-width:66px;font-size:14.5px;color:#222}
.person .pa{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:19px;color:#fff}
.money{display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.money .amt{display:flex;align-items:baseline;gap:6px}
.money .cur{font-size:14px;color:#444;display:flex;align-items:center;gap:6px}
.money .val{font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.money .flag{width:22px;height:14px;border-radius:2px;background:linear-gradient(90deg,#e8262c 0 25%,transparent 25%),linear-gradient(180deg,#00843d 0 33%,#fff 33% 66%,#000 66%)}
.pill-btn{border:0;background:var(--grad);color:#fff;font-weight:600;font-size:16px;padding:13px 28px;border-radius:999px;box-shadow:0 8px 20px rgba(240,80,40,.3)}
.recent{margin:4px 16px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.rrow:last-child{border-bottom:0}
.rrow .ri{width:38px;height:38px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-weight:600;color:var(--o2)}
.rrow .rn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rs{font-size:12.5px;color:var(--muted)}
.rrow .ra{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:#1d1d1f;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:60;max-width:88%;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ── the assistant sheet ─────────────────────────────────────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(40,40,40,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-radius:34px 34px 0 0;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);
  max-height:88%;display:flex;flex-direction:column;padding:10px 0 max(env(safe-area-inset-bottom),18px)}
.sheet.on{transform:none}
.grab{width:72px;height:5px;border-radius:3px;background:rgba(0,0,0,.12);margin:2px auto 10px}
.shead{display:grid;grid-template-columns:108px 1fr 108px;align-items:center;padding:0 16px}
.shead h2{margin:0;text-align:center;font-size:24px;font-weight:400}
.shead h2 b{font-weight:700}
.sid{display:block;font:500 10px/1.2 ui-monospace,monospace;color:#9a7a68;letter-spacing:.02em;margin-top:2px}
.partial{opacity:.6}
.lang{justify-self:start;display:flex;border-radius:999px;background:rgba(255,255,255,.55);padding:3px}
.lang button{border:0;background:none;font-size:12px;font-weight:600;padding:5px 9px;min-width:30px;border-radius:999px;color:#7a5a48}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.close{justify-self:end;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.55);font-size:18px;color:#6a4b3a}
.sbody{flex:1;overflow-y:auto;padding:4px 22px 6px;display:flex;flex-direction:column;align-items:center}
.orb{width:min(46vw,190px);aspect-ratio:1;margin:8px auto 2px;position:relative;transition:width .35s}
.orb img{width:100%;height:100%;filter:drop-shadow(0 24px 22px rgba(160,70,40,.28))}
.orb.listen img{animation:listen 1.1s ease-in-out infinite}
.orb.think img{animation:think 1.6s linear infinite}
.orb.small{width:min(30vw,118px)}
@keyframes listen{50%{transform:scale(1.07)}}
@keyframes think{to{transform:rotate(360deg)}}
.level{position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,140,40,.0);transition:border-color .1s,transform .1s}
.headline{font-size:26px;font-weight:700;text-align:center;margin:14px 0 6px;line-height:1.2;max-width:22ch}
.headline.quote{font-size:25px}
.sub{font-size:16px;color:#3a2a22;text-align:center;margin:0 0 6px;max-width:30ch;line-height:1.45}
.retry{border:0;background:none;color:var(--o2);font-size:17px;font-weight:500;margin:6px 0}
.chips{display:grid;gap:10px;width:100%;margin:16px 0 4px}
.chips button{border:0;border-radius:999px;padding:15px 18px;font-size:17px;color:#2b2b2b;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.55));box-shadow:0 6px 16px rgba(120,60,40,.14),inset 0 1px 0 #fff}
.answer{width:100%;background:rgba(255,255,255,.78);border-radius:20px;padding:16px 16px 12px;font-size:16px;line-height:1.5;box-shadow:0 10px 26px rgba(120,60,40,.12);margin-top:12px}
.answer b{font-weight:600}
.answer .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.answer .opts button{border:1px solid #f0d9cc;background:#fff;border-radius:999px;padding:8px 12px;font-size:13.5px;text-align:left}
.answer ol{margin:6px 0 0;padding-left:20px}
.answer.rtl{direction:rtl;text-align:right;font-family:"Noto Sans Arabic",var(--font)}
.rows{margin-top:10px;display:grid;gap:6px}
.rows div{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid #f3e6de;padding-top:6px}
.rows span{color:var(--muted);font-size:12.5px}
.why{margin-top:10px;display:inline-flex;gap:6px;align-items:center;font-size:12px;color:#7a5a48;background:rgba(255,255,255,.6);border-radius:999px;padding:5px 10px;border:0}
.why i{font-style:normal;font-weight:600;color:#3a2a22}
.lane{font-weight:600;padding:2px 7px;border-radius:999px;color:#fff;font-size:11px}
.lane.action{background:#e2561e} .lane.retrieval{background:#2a78d6} .lane.data{background:#1f8a4c} .lane.handoff{background:#8b5cf6} .lane.decline{background:#777}
.whybox{width:100%;font-size:12.5px;color:#4a3a30;background:rgba(255,255,255,.55);border-radius:14px;padding:10px 12px;margin-top:8px;display:none}
.whybox.on{display:block}
.whybox div{display:flex;justify-content:space-between;padding:2px 0}
/* confirmation card */
.card{width:100%;border-radius:22px;overflow:hidden;margin-top:16px;background:rgba(255,255,255,.62);box-shadow:0 16px 36px rgba(120,60,40,.16),inset 0 1px 0 #fff}
.card .who{display:flex;gap:14px;align-items:center;padding:16px 18px;background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(250,215,200,.5))}
.card .who .pa{width:54px;height:54px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px;box-shadow:0 0 0 3px #fff}
.card .who b{display:block;font-size:18px;font-weight:600}
.card .who span{font-size:15px;color:#6a6a70;letter-spacing:.04em}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 28px;padding:16px 18px 18px}
.card .kv span{font-size:15px;color:#6a6a70}
.card .kv b{font-size:17px;font-weight:600}
.confirm{width:100%;border:0;margin-top:22px;border-radius:999px;padding:18px;font-size:20px;color:#3a3a3a;background:linear-gradient(180deg,#f5f5f5,#dcdcdc);box-shadow:0 10px 22px rgba(0,0,0,.14),inset 0 1px 0 #fff}
.confirm.go{color:#fff;background:var(--grad);box-shadow:0 12px 26px rgba(240,80,40,.35)}
.cancel{border:0;background:none;color:#7a5a48;font-size:16px;margin-top:10px}
/* PIN */
.pinbox{width:100%;display:flex;justify-content:space-around;background:#fff;border-radius:14px;padding:22px 30px;margin-top:6px;box-shadow:inset 0 0 0 1px #f0e2da}
.pinbox i{width:16px;height:16px;border-radius:50%;background:#efe2da;transition:background .15s}
.pinbox i.f{background:#e8591e}
.pin-note{font-size:13.5px;color:#7a5a48;margin:10px 0 0;text-align:center;min-height:1.2em}
.pin-note.err{color:var(--bad);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:18px}
.keys button{border:0;background:none;font-size:30px;font-weight:400;padding:14px 0;color:#1d1d1d}
.keys button:active{background:rgba(255,255,255,.4);border-radius:14px}
/* result */
.result{display:grid;justify-items:center;gap:6px;margin-top:10px;text-align:center}
.tick{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:42px;background:var(--ok);box-shadow:0 14px 30px rgba(31,138,76,.35)}
.tick.bad{background:var(--bad);box-shadow:0 14px 30px rgba(198,40,40,.3)}
.result .ref{font-size:13px;color:#6a5a50;letter-spacing:.03em}
/* controls */
.controls{display:flex;justify-content:center;gap:70px;padding:10px 0 2px}
.ctl{display:grid;justify-items:center;gap:8px;border:0;background:none;color:#7a6a64;font-size:15px}
.ctl .disc{width:76px;height:76px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 22px rgba(240,80,40,.35),0 0 0 4px #fff}
.ctl .disc svg{width:32px;height:32px;stroke:#fff}
.ctl.rec .disc{animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{box-shadow:0 10px 22px rgba(240,80,40,.35),0 0 0 12px rgba(255,255,255,.7)}}
.ctl[disabled]{opacity:.45}
.typer{display:none;gap:8px;width:calc(100% - 44px);margin:8px auto 0}
.typer.on{display:flex}
.typer input{flex:1;min-width:0;border:0;border-radius:999px;padding:14px 18px;font-size:16px;font-family:inherit;background:#fff;box-shadow:inset 0 0 0 1px #f0d9cc}
.typer button{border:0;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;padding:0 20px;font-size:15px}
.mic-hint{font-size:12.5px;color:#7a4a30;background:rgba(255,255,255,.6);border-radius:12px;padding:8px 12px;margin:8px 22px 0;text-align:center;display:none}
.mic-hint.on{display:block}
.mic-hint a{color:var(--o3)}
.sheet.focus .controls,.sheet.focus .typer{display:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.orb img,.ai-btn img,.ai-btn::after,.ctl.rec .disc{animation:none!important}}

/* ── login: mobile -> OTP -> PIN, as the OpenWallet app does it ──────────────────── */
.auth{position:absolute;inset:0;z-index:60;background:#fcf6f2;display:flex;flex-direction:column;transition:opacity .3s}
.auth.gone{opacity:0;pointer-events:none}
.auth .ahead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:18px 12px 10px}
.auth .ahead button{border:0;background:none;padding:6px;cursor:pointer}
.auth .ahead h2{margin:0;text-align:center;font-size:19px;font-weight:600}
.auth .bar{height:4px;margin:4px 14px 0;border-radius:4px;background:#f6e6dd;overflow:hidden}
.auth .bar i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .35s}
.auth .abody{flex:1;display:flex;flex-direction:column;padding:0 22px;overflow:auto}
.auth h1{font-size:34px;line-height:1.15;font-weight:600;text-align:center;margin:44px 0 14px;letter-spacing:-.3px}
.auth .lead{text-align:center;color:#8b8b90;font-size:15.5px;line-height:1.45;margin:0 0 26px}
.mob{display:flex;align-items:center;gap:10px;border-radius:12px;padding:15px 16px;background:#fff;
  border:2px solid transparent;background-image:linear-gradient(#fff,#fff),linear-gradient(90deg,#f5c242,#e8402c);
  background-origin:border-box;background-clip:padding-box,border-box;font-size:19px}
.mob .fl{width:30px;height:20px;border-radius:4px;overflow:hidden;display:grid;grid-template-columns:8px 1fr;flex:none}
.mob .fl b{background:#ef3340}.mob .fl span{display:grid;grid-template-rows:1fr 1fr 1fr}
.mob .fl span i:nth-child(1){background:#009739}.mob .fl span i:nth-child(2){background:#fff;box-shadow:inset 0 0 0 .5px #ddd}.mob .fl span i:nth-child(3){background:#000}
.mob .cc{color:#111}.mob .num{letter-spacing:.5px;min-height:1em}.mob .num::after{content:"";display:inline-block;width:1.5px;height:20px;background:#555;margin-left:2px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.or{display:flex;align-items:center;gap:16px;color:#9a9aa0;font-size:15px;margin:26px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:#d9d6d3}
.uae{border:1.5px solid #1d1d1d;border-radius:999px;background:#fff;padding:13px;font-size:19px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:center;font-family:var(--font);cursor:pointer}
.terms{display:flex;gap:12px;align-items:flex-start;margin:26px 0 20px;font-size:15px;line-height:1.45;color:#333;cursor:pointer}
.terms .cb{width:26px;height:26px;border-radius:7px;border:1.5px solid #c8c4c0;flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.terms.on .cb{border:0;background:var(--grad)}
.terms a{color:#d8452e}
.go-btn{border:0;border-radius:999px;padding:16px;font-size:19px;font-weight:500;color:#fff;background:#b9babd;font-family:var(--font);width:100%;transition:background .2s}
.go-btn.on{background:var(--grad);box-shadow:0 10px 22px rgba(240,80,40,.28);cursor:pointer}
.ghost{margin-top:12px;border:1.5px solid #ecdcd4;border-radius:999px;padding:15px;font-size:18px;color:#a8a8ad;background:none;width:100%;font-family:var(--font)}
.ghost.on{color:#d8452e;border-color:#f0b9a8;cursor:pointer}
.akeys{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 26px 22px;row-gap:6px}
.akeys button{border:0;background:none;font-size:28px;padding:12px 0;font-family:var(--font);color:#111;cursor:pointer}
.akeys button:active{opacity:.5}
.bubble{width:200px;height:200px;border-radius:50%;background:#fff;margin:26px auto 6px;display:grid;place-items:center}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:4px 0 28px}
.otp i{aspect-ratio:1;border:1.5px solid #e6dfda;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:22px}
.otp i.f::after{content:"";width:8px;height:8px;border-radius:50%;background:#111}
.aerr{color:var(--bad);text-align:center;font-size:14.5px;min-height:20px;margin:-14px 0 8px}
.auth.pin{background:linear-gradient(180deg,#f9474e 0%,#fb7a2f 48%,#fdb515 100%)}
.auth.pin .abody{color:#fff}
.auth.pin h1{color:#fff;margin-top:120px;font-size:32px}
.pinrow{background:#fff;border-radius:12px;display:grid;grid-template-columns:repeat(4,1fr);padding:22px 30px;justify-items:center}
.pinrow i{width:28px;height:28px;border-radius:50%;background:#f1f0ef}.pinrow i.f{background:#e8402c}
.forgot{color:#fff;text-align:center;text-decoration:underline;font-size:17px;margin:26px 0}
.auth.pin .or{color:#ffe7d6}.auth.pin .or::before,.auth.pin .or::after{background:#ffd2b5}
.auth.pin .akeys button{color:#fff}
.demo-tag{position:absolute;top:14px;right:-34px;transform:rotate(45deg);background:#f39a2c;color:#fff;font-size:12px;font-weight:600;padding:3px 40px;z-index:61}
.logout{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--font)}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="scroll" id="home">
    <div class="top">
      <div class="avatar" id="me-initials">·</div>
      <img class="logo" src="img/logo.png" alt="OpenWallet">
      <button class="bell" aria-label="Notifications"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d1d1d" stroke-width="1.6"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
    </div>
    <div class="hello"><h1 id="hello">Hello!</h1>
      <button class="ai-btn" id="open-ai" aria-label="Open OpenWallet Assistant"><img src="img/orb.png" alt=""></button></div>
    <div class="tiles" id="tiles"></div>
    <div class="promo"><div class="deco"></div>
      <h2>Wallet to Wallet, Without Costs</h2>
      <p>Enjoy zero fees on transfers to friends &amp; family.</p>
      <button class="cta" data-ask="I want to send money">Send Money</button></div>
    <div class="sec"><h3>Recipients</h3><span>from your payments</span></div>
    <div class="people" id="people"></div>
    <div class="sec"><h3>Wallet</h3><span id="bal-src"></span></div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// Identity: logging in gives this customer a bot_id (their Payment Agent); every time the
// agent is opened a new session_id is issued under it, and the engine remembers everything
// said in that session.
let BOT = null, SESSION = null;
// "Pay a merchant and split it with Alex": the engine answers the payment and returns the
// split as the plan's second step; once that payment succeeds, the split is asked for.
let PENDING_SPLIT = null;
async function login(){
  try { BOT = (await fetch('/api/cx/login', {method: 'POST'}).then(r => r.json())).bot_id; } catch(e){}
}
async function newSession(){
  SESSION = null;
  try {
    const r = await fetch('/api/cx/session', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                              body: JSON.stringify({bot_id: BOT, channel: 'app'})}).then(x => x.json());
    SESSION = r.session_id || null;
  } catch(e){}

  $('sid').textContent = SESSION;
}
const GRADS = ['linear-gradient(135deg,#ffb000,#f0302a)','linear-gradient(135deg,#7b61ff,#2a78d6)','linear-gradient(135deg,#1baf7a,#0b7285)','linear-gradient(135deg,#ff5f8a,#c2185b)','linear-gradient(135deg,#ff9f43,#e2561e)','linear-gradient(135deg,#6a5acd,#c471ed)'];
let LANG = 'auto';

/* ── home: everything from the live service ───────────────────────────────── */
const TILES = [
  ['Connect Bank', 'Connect my bank', '<path d="M3 10h18M5 10v8m4-8v8m6-8v8m4-8v8M3 21h18M12 3 3 8h18z"/>'],
  ['Send to Mobile', 'I want to send money', '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><circle cx="12" cy="17.5" r=".9"/>'],
  ['Scan QR', 'I want to pay at a shop', '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/>'],
  ['Add Money', 'Add money to my wallet', '<rect x="4" y="5" width="13" height="15" rx="2"/><path d="M7 3h11a2 2 0 0 1 2 2v12M10.5 9.5v6M7.5 12.5h6"/>'],
  ['Withdraw Money', 'Withdraw money', '<rect x="4" y="5" width="13" height="15" rx="2"/><path d="M7 3h11a2 2 0 0 1 2 2v12M7.5 12.5h6"/>'],
  ['Pay Bills', 'Pay my DEWA bill', '<path d="M5 3h14v18l-2.3-1.5L14.3 21 12 19.5 9.7 21l-2.4-1.5L5 21z"/><path d="M8.5 8h7M8.5 11.5h7M8.5 15h4"/>'],
];
$('tiles').innerHTML = TILES.map(([name, ask, path]) =>
  `<button class="tile" data-ask="${esc(ask)}"><svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#f0302a"/></linearGradient></defs>${path}</svg>${esc(name)}</button>`).join('');

async function loadHome(){
  let d;
  try { d = await fetch('/api/cx/home').then(r => r.json()); } catch(e){ return; }
  $('hello').textContent = `Hello ${d.name || ''}!`;
  $('me-initials').textContent = (d.name || '?')[0];
  if (d.balance != null){
    $('bal').textContent = Math.floor(d.balance).toLocaleString('en-US');
    $('bal-src').innerHTML = d.live ? '<span class="live-dot"></span>live from your wallet' : '';
  }
  $('people').innerHTML = (d.recipients || []).map((p, i) =>
    `<button class="person" data-ask="Send money to ${esc(p.short)}"><span class="pa" style="background:${GRADS[i % GRADS.length]}">${esc(p.initials)}</span>${esc(p.short)}</button>`).join('');
  $('recent').innerHTML = (d.recent || []).map(t =>
    `<div class="rrow" data-ask="What happened to my payment of ${t.amount} AED to ${esc((t.payee||'').split(' ')[0])}?"><span class="ri">${esc((t.payee || '?')[0])}</span>
      <div><div class="rn">${esc(t.payee)}</div><div class="rs">${esc(t.status)} · ${esc(t.when)}</div></div>
      <div class="ra">−${fmt(t.amount)}</div></div>`).join('') || '<div class="rrow"><div></div><div class="rs">No payments yet</div><div></div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ask]'); if (!b || b.closest('#sheet')) return;
  openSheet(); typedMode(false); setTimeout(() => ask(b.dataset.ask), 250);
});

/* ── the sheet and its states ─────────────────────────────────────────────── */
const SUGGEST = ['“Send AED 50 to Alex”', '“Pay my DEWA bill”', '“What bills are coming up?”', '“What’s my balance?”', '“How do I add money?”'];
function setState({orb = '', head = '', quote = false, sub = '', chips = false, retry = false, out = '', focus = false} = {}){
  $('sheet').classList.toggle('focus', focus);
  $('orb').className = 'orb ' + orb;
  $('headline').textContent = head; $('headline').classList.toggle('quote', quote);
  $('headline').hidden = !head; $('sub').textContent = sub; $('sub').hidden = !sub;
  $('retry').hidden = !retry;
  $('chips').innerHTML = chips ? SUGGEST.map(s => `<button>${esc(s)}</button>`).join('') : '';
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent.replace(/[“”]/g, '')));
  $('out').innerHTML = out;
}
function openSheet(){
  newSession();
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
  setState({head: 'I’m Listening…', sub: 'Tell me what you would like to do', chips: true});
  checkMic();
}
function closeSheet(){
  stopRec(true);
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  loadHome();
}
$('open-ai').onclick = () => { openSheet(); if (MIC_OK) setTimeout(startRec, 150); };
$('close').onclick = closeSheet; $('scrim').onclick = closeSheet;
$('retry').onclick = () => { setState({head: 'I’m Listening…', sub: 'Say it again', orb: ''}); startRec(); };
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  LANG = b.dataset.l; document.querySelectorAll('.lang button').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (LANG === 'auto') newSession();      // auto detects again on the next utterance
  toast(LANG === 'auto' ? 'Voice language: detected automatically' : LANG === 'ar' ? 'لغة الصوت: العربية' : 'Voice language: English');
});
function typedMode(on){ $('typer').classList.toggle('on', on); if (on) setTimeout(() => $('q').focus(), 50); }
$('kbd').onclick = () => { stopRec(true); typedMode(!$('typer').classList.contains('on')); };
$('send').onclick = () => { const t = $('q').value.trim(); if (t){ $('q').value = ''; ask(t); } };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2600); }

/* ── voice: PCM -> 16 kHz WAV in the page, so every browser works ───────── */
// getUserMedia exists only in a SECURE context (https or localhost). That is why the mic
// "did not work over the LAN": served as http://192.168.x.x the API is simply absent.
// This app is served over https by serve_app.py, so phones on the LAN get the mic.
const MIC_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function checkMic(){
  const h = $('mic-hint');
  if (MIC_OK){ h.classList.remove('on'); return; }
  h.classList.add('on');
  h.innerHTML = window.isSecureContext ? 'This browser does not allow microphone access. You can still type.'
    : `Voice needs a secure connection. Open <a href="https://${location.hostname}:8443/">https://${esc(location.hostname)}:8443</a>.`;
  $('mic').disabled = true;
}
let rec = null;
// ── listening: only SPEECH starts anything ──────────────────────────────────────────
// Before: any sound above a fixed level counted as speech, so opening the agent in a room
// with music sent a request at once and whisper answered "music". Now:
//   1. the first 0.4 s measures this room's noise floor;
//   2. speech = energy in the VOICE band (250–3,500 Hz, where bass and hum are not) clearly
//      above that floor, sustained for ~0.25 s — a cough or a beat is not enough;
//   3. only then does the 5-second window start; 0.8 s of quiet ends it early;
//   4. no speech at all means NO request: after 8 s the mic simply closes.
const VAD = {calib: 0.4, startNeed: 0.25, endQuiet: 0.8, maxSpeech: 5.0, idle: 8.0, minFloor: 0.004};
async function startRec(){
  if (!MIC_OK || rec) return;
  typedMode(false);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true}}); }
  catch(e){ toast('Microphone permission was not given'); return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  // recording path: rumble removed, the rest of the voice kept for whisper
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
  // detection path: the voice band only
  const bp1 = ctx.createBiquadFilter(); bp1.type = 'highpass'; bp1.frequency.value = 250;
  const bp2 = ctx.createBiquadFilter(); bp2.type = 'lowpass'; bp2.frequency.value = 3500;
  const an = ctx.createAnalyser(); an.fftSize = 2048;
  src.connect(hp); src.connect(bp1); bp1.connect(bp2); bp2.connect(an);
  const proc = ctx.createScriptProcessor(2048, 1, 1);
  hp.connect(proc); proc.connect(ctx.destination);
  const band = new Float32Array(an.fftSize);
  const chunks = [], energy = [];
  const st = {t: 0, floor: null, calib: [], run: 0, start: -1, quiet: 0, last: -1};
  proc.onaudioprocess = ev => {
    const x = ev.inputBuffer.getChannelData(0); chunks.push(new Float32Array(x));
    const dt = x.length / ctx.sampleRate; st.t += dt;
    an.getFloatTimeDomainData(band);
    let e = 0; for (let i = 0; i < band.length; i++) e += band[i] * band[i]; e = Math.sqrt(e / band.length);
    energy.push(e);
    if (st.floor === null){                                  // 1. learn the room
      st.calib.push(e);
      if (st.t >= VAD.calib){ const c = st.calib.slice().sort((p, q) => p - q); st.floor = Math.max(VAD.minFloor, c[Math.floor(c.length / 2)]); }
      return;
    }
    const thr = Math.max(0.012, st.floor * 3.2);
    const loud = e > thr;
    $('level').style.borderColor = `rgba(255,140,40,${loud ? Math.min(.9, e / thr * .35) : 0})`;
    $('level').style.transform = `scale(${1 + (loud ? Math.min(.12, e * 2) : 0)})`;
    if (st.start < 0){                                       // 2. waiting for a voice
      if (loud){ st.run += dt; if (st.run >= VAD.startNeed){ st.start = chunks.length - Math.ceil(st.run / dt); onSpeech(); } }
      else { st.run = 0; st.floor = st.floor * 0.97 + e * 0.03; }   // the room changes; follow it
      if (st.t > VAD.idle + VAD.calib) stopRec(true, 'idle');
      return;
    }
    if (loud){ st.quiet = 0; st.last = chunks.length; } else st.quiet += dt;   // 3. speaking
    const spoken = (chunks.length - st.start) * dt;
    $('sub').textContent = `Listening… ${Math.max(0, Math.ceil(VAD.maxSpeech - spoken))}s`;
    if (st.quiet >= VAD.endQuiet || spoken >= VAD.maxSpeech) stopRec(false);
  };
  rec = {stream, ctx, proc, chunks, energy, st, rate: ctx.sampleRate, heardAny: () => st.start >= 0};
  function onSpeech(){
    $('chips').innerHTML = '';
    $('headline').textContent = '…'; $('headline').classList.add('quote', 'partial'); $('headline').hidden = false;
  }
  // Live words — only once speech has begun, and only real words (the server drops noise).
  rec.partialTimer = setInterval(async () => {
    if (!rec || st.start < 0 || rec.partialBusy) return;
    rec.partialBusy = true;
    const r0 = rec;
    try {
      const w = toWav(speechOnly(r0), r0.rate);
      const p = await fetch(`/api/stt?partial=1&lang=${LANG}&session=${SESSION}`, {method: 'POST', headers: {'Content-Type': 'audio/wav'}, body: w}).then(x => x.json());
      if (rec === r0 && p.ok && p.text){ $('headline').textContent = `“${p.text}”`; }
    } catch(_){}
    r0.partialBusy = false;
  }, 1000);
  $('mic').classList.add('rec'); $('mic-label').textContent = 'Tap to stop';
  setState({orb: 'listen', head: 'I’m Listening…', sub: 'Tell me what you would like to do', chips: true});
}
function stopRec(discard, why){
  if (!rec) return;
  const r = rec; rec = null; clearInterval(r.partialTimer);
  $('headline').classList.remove('partial');
  try { r.proc.disconnect(); r.stream.getTracks().forEach(t => t.stop()); r.ctx.close(); } catch(_){}
  $('mic').classList.remove('rec'); $('mic-label').textContent = 'Tap to speak';
  $('level').style.borderColor = 'transparent';
  if (why === 'idle'){ setState({head: 'Tap the mic when you’re ready', sub: 'Or tap a suggestion below', chips: true}); return; }
  if (discard) return;
  if (!r.heardAny()){ setState({head: 'Tap the mic when you’re ready', sub: 'Or tap a suggestion below', chips: true}); return; }
  transcribe(toWav(speechOnly(r), r.rate));
}
// From a little before the voice started to a little after it stopped — nothing else is sent.
function speechOnly(r){
  const per = r.chunks[0] ? r.chunks[0].length : 2048;
  const pad = Math.ceil(0.3 * r.rate / per);
  const a = Math.max(0, r.st.start - pad);
  const b = Math.min(r.chunks.length, (r.st.last > 0 ? r.st.last : r.chunks.length) + pad);
  return r.chunks.slice(a, b);
}
$('mic').onclick = () => rec ? stopRec(false) : startRec();
function toWav(chunks, rate){
  let n = 0; chunks.forEach(c => n += c.length);
  const all = new Float32Array(n); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  const ratio = rate / 16000, len = Math.floor(n / ratio), pcm = new Int16Array(len);
  for (let i = 0; i < len; i++){ const s = Math.max(-1, Math.min(1, all[Math.floor(i * ratio)])); pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true);
  v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], {type: 'audio/wav'});
}
async function transcribe(wav){
  setState({orb: 'think', head: 'Got it…', sub: 'Turning your voice into text'});
  let r;
  const t0 = performance.now();
  try { r = await fetch(`/api/stt?lang=${LANG}&session=${SESSION}`, {method: 'POST', headers: {'Content-Type': 'audio/wav'}, body: wav}).then(x => x.json()); }
  catch(e){ r = {ok: false, error: 'speech service unreachable'}; }
  if (!r.ok || !r.text){ setState({head: 'I didn’t catch any words', sub: r.ok ? 'Tap the mic and try again — or type instead' : 'Voice is unavailable right now — you can type instead', chips: true}); return; }
  r.roundtrip_ms = Math.round(performance.now() - t0);
  lastHeard = r; ask(r.text, true);
}
let lastHeard = null;

/* ── one turn ─────────────────────────────────────────────────────────────── */
const ACTION = new Set(['send_money','pay_merchant','bill_pay','bill_schedule','split_payment','mobile_recharge','reminder_set','add_money','withdraw_money','link_bank','retry_payment','cancel_action']);
const RETRIEVAL = new Set(['journey_help','knowledge_query','fees_query','time_query','limits_query']);
const HANDOFF = new Set(['human_handoff','wrong_transfer','report_fraud']);
const laneOf = i => ACTION.has(i) ? 'action' : RETRIEVAL.has(i) ? 'retrieval' : HANDOFF.has(i) ? 'handoff' : i === 'out_of_scope' ? 'decline' : 'data';
const LANE_TEXT = {action: 'Action', retrieval: 'Knowledge', data: 'Your data', handoff: 'Support', decline: 'Declined'};
const isArabic = t => /[؀-ۿ]/.test(t || '');

async function ask(text, spoken, pick){
  typedMode(false);
  const who = (text.match(/\b(?:to|pay)\s+([A-Z][a-z]+|[a-z]{3,})\b/) || [])[1];
  const finding = /send|transfer|pay\b/i.test(text) && who && !/bill|dewa|etisalat|du\b|shop|merchant/i.test(text);
  setState({orb: 'think', quote: true, head: `“${text}”`, retry: !!spoken,
            sub: finding ? `Finding ${who[0].toUpperCase() + who.slice(1)}… let me find the right recipient and verify the details.` : 'Working on it…'});
  let a;
  try {
    a = await fetch('/api/cx/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({text, session: SESSION, bot_id: BOT, pick: pick || null,
                                                          stt: spoken ? lastHeard : null})}).then(r => r.json());
  } catch(e){ a = null; }
  if (!a || a.ok === false && !a.say){ setState({head: 'Something went wrong', sub: (a && a.error) || 'The OpenWallet service did not answer. Nothing has moved.', chips: true}); return; }
  render(text, a, spoken);
}

function why(a){
  const lane = laneOf(a.intent);
  const id = 'w' + Math.random().toString(36).slice(2, 7);
  const top = (a.top || []).slice(0, 3).map(t => `<div><span>${esc(t.intent || t[0])}</span><b>${(((t.p ?? t.confidence ?? t[1]) || 0) * 100).toFixed(1)}%</b></div>`).join('');
  return `<button class="why" onclick="document.getElementById('${id}').classList.toggle('on')"><span class="lane ${lane}">${LANE_TEXT[lane]}</span>understood as <i>${esc(a.intent)}</i>${a.confidence != null ? ' · ' + Math.round(a.confidence * 100) + '%' : ''}</button>
    <div class="whybox" id="${id}"><div><span>decided by</span><b>${esc(a.model || '—')}</b></div><div><span>outcome</span><b>${esc(a.outcome || '—')}</b></div>
    ${lastHeard ? `<div><span>heard (${esc(lastHeard.lang || '')}, ${lastHeard.ms} ms)</span><b>${esc(lastHeard.text)}</b></div>` : ''}${top}<div><span>answered in</span><b>${a.ms ?? '—'} ms</b></div></div>`;
}
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\s(\d+)\.\s/g, '<br>$1. ').replace(/\n/g, '<br>'); }

function render(text, a, spoken){
  const p = a.proposal;
  if (a.slots && Array.isArray(a.slots.split_after) && a.slots.split_after.length) PENDING_SPLIT = a.slots.split_after;
  lastHeard = spoken ? lastHeard : null;
  if (p && !a.confirmed && p.kind === 'email_statement') return emailCard(a, p);
  if (p && !a.confirmed && ['send', 'merchant', 'pay_merchant', 'bill', 'bill_pay', 'split', 'recharge'].includes(p.kind)) return confirmCard(text, a, p);
  if (a.confirmed && p && p.kind === 'email_statement') return doAct({kind: 'email_statement', count: p.count});
  if (a.confirmed && p) return doAct(Object.assign({kind: p.kind}, p));
  const rows = (a.rows || []).slice(0, 5).map(r => `<div><b>${esc(r.payee || r.name || '')}</b><span>${r.amount != null ? fmt(r.amount) + ' ' + esc(r.currency || 'AED') : ''} · ${esc(r.status || '')} · ${esc(r.when || '')}</span></div>`).join('');
  const opts = (a.options || []).filter(o => o.kind !== 'pick_txn' || !rows).slice(0, 6)
    .map((o, i) => `<button data-o="${i}">${esc(o.label || o.text || o.kind)}</button>`).join('');
  setState({orb: 'small', head: '', out:
    `<div class="answer ${isArabic(a.say) ? 'rtl' : ''}">${md(a.say || 'Done.')}${rows ? `<div class="rows">${rows}</div>` : ''}${opts ? `<div class="opts">${opts}</div>` : ''}</div>${why(a)}`});
  $('out').querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const o = a.options[+b.dataset.o];
    if (o.kind === 'navigate'){ toast(`Opens the ${b.textContent.replace(/^Open /, '')} screen`); return; }
    if (o.kind === 'label' || o.kind === 'dismiss') return;
    // A choice is a QUESTION back to the engine with a structured pick (the person, payment
    // or merchant they pointed at) — never an action. These used to go to /api/cx/act, which
    // knows only money-moving kinds, so tapping "Alex" in a split answered "I do not know how
    // to do that". Same mapping as the engine's spoken "the first one".
    const c = choice(o);
    if (c) return ask(c[0], false, c[1]);
    doAct(Object.assign({}, o));
  });
}

function choice(o){
  const first = l => (l || '').split(' ·')[0];
  switch (o.kind){
    case 'ask_text':   return o.text ? [o.text, null] : null;
    case 'pick_txn':   return [o.label, {intent: 'txn_status', slots: {txn_ref: o.ref}}];
    case 'ask_refund': return ['Refund ' + o.label, {intent: 'refund_request', slots: {txn_ref: o.ref}}];
    case 'send_to':    return ['Send to ' + o.payee, {intent: 'send_money', slots: {payee: o.payee}}];
    case 'pay_merchant': return o.merchant ? ['Pay ' + o.merchant, {intent: 'pay_merchant', slots: {merchant: o.merchant}}] : null;
    case 'journey':    return [o.label, {intent: 'journey_help', slots: {}}];
    case 'split_with': return ['Split with ' + first(o.label), {intent: 'split_payment', slots: {participants: [{name: o.name, userId: o.userId}]}}];
  }
  return null;
}

function emailCard(a, p){
  setState({orb: 'small', head: '', focus: true, out: `
    <div class="card"><div class="who"><span class="pa">✉</span><div><b>${esc(p.to)}</b><span>Your email on file</span></div></div>
      <div class="kv"><span>Sending</span><span>Purpose</span><b>Last ${esc(String(p.count))} transactions</b><b>Statement</b></div></div>
    <button class="confirm go" id="go">Confirm &amp; Send</button>
    <button class="cancel" id="nogo">Cancel</button>${why(a)}`});
  // Only the count goes to the server. The address is looked up there, from the profile.
  $('go').onclick = () => doAct({kind: 'email_statement', count: p.count});
  $('nogo').onclick = () => { setState({head: 'Cancelled', sub: 'Nothing was sent.', chips: true}); fetch('/api/cx/ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: 'no, cancel', session: SESSION})}); };
}

function confirmCard(text, a, p){
  const name = p.payee || p.merchant || p.biller || p.bill || 'Payee';
  const initials = name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const purpose = p.kind === 'send' ? 'Personal Transfer' : p.kind === 'split' ? 'Split payment' : p.kind === 'recharge' ? 'Mobile recharge' : /bill/.test(p.kind) ? 'Bill payment' : 'Merchant payment';
  const amt = p.payable ?? p.amount;
  const sub = p.kind === 'recharge' ? 'Prepaid top-up' : p.kind === 'send' ? (p.retry_of ? 'New attempt · previous one failed' : 'OpenWallet wallet') : (p.account ? '•••• ' + String(p.account).slice(-4) : (p.mid || ''));
  setState({orb: 'small', head: '', focus: true, out: `
    <div class="card"><div class="who"><span class="pa">${esc(initials)}</span><div><b>${esc(name)}</b><span>${esc(sub)}</span></div></div>
      <div class="kv"><span>Amount</span><span>Purpose</span><b>${esc(p.currency || 'AED')} ${fmt(amt)}</b><b>${esc(purpose)}</b>
      ${p.discount ? `<span>Offer</span><span></span><b>− AED ${fmt(p.discount)}</b><span></span>` : ''}</div></div>
    <button class="confirm go" id="go">Confirm &amp; Send</button>
    <button class="cancel" id="nogo">Cancel</button>${why(a)}`});
  $('go').onclick = () => doAct(Object.assign({kind: p.kind}, p));
  $('nogo').onclick = () => { setState({head: 'Cancelled', sub: 'Nothing was sent.', chips: true}); fetch('/api/cx/ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: 'no, cancel', session: SESSION})}); };
}

/* ── confirm -> PIN -> result, through the server's own PIN gate ──────────── */
let pending = null;
async function doAct(payload){
  setState({orb: 'think', head: 'One moment…', sub: 'Running the usual checks'});
  let r;
  try { r = await fetch('/api/cx/act', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({session: SESSION}, payload))}).then(x => x.json()); }
  catch(e){ return setState({head: 'No answer from OpenWallet', sub: 'I could not tell whether that went through. Check your balance before trying again.'}); }
  if (payload.kind !== 'pin') pending = payload;
  if (r.needPin || r.retry) return pinPad(r);
  if (r.started) return awaitResult(pending || payload);
  if (r.done) return setState({orb: 'small', head: '', focus: true, out: `<div class="result"><div class="tick">✓</div>
      <div class="headline">Email sent</div><p class="sub">${esc(r.say || '')}</p></div>`});
  setState({orb: 'small', head: '', out: `<div class="answer">${md(r.say || r.error || (r.ok ? 'Done.' : 'That did not complete. Nothing has moved.'))}</div>`});
}
function pinPad(r){
  let pin = '';
  setState({head: '', focus: true, out: `
    <div class="pinbox" id="pinbox">${'<i></i>'.repeat(4)}</div>
    <p class="pin-note ${r.retry ? 'err' : ''}" id="pin-note">${esc(r.retry ? (r.error || 'That PIN was not right.') : 'Enter your 4-digit PIN')}</p>
    <button class="confirm" id="pin-go" disabled>Confirm &amp; Send</button>
    <div class="keys">${[1,2,3,4,5,6,7,8,9,'.',0,'⌫'].map(k => `<button data-k="${k}">${k}</button>`).join('')}</div>`});
  $('orb').className = 'orb'; $('orb').hidden = true;
  const dots = () => { $('pinbox').querySelectorAll('i').forEach((d, i) => d.classList.toggle('f', i < pin.length)); $('pin-go').disabled = pin.length < 4; $('pin-go').classList.toggle('go', pin.length === 4); };
  $('out').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === '⌫') pin = pin.slice(0, -1); else if (k !== '.' && pin.length < 4) pin += k;
    dots();
  });
  $('pin-go').onclick = async () => { $('orb').hidden = false; const p = pin; pin = ''; await doAct({kind: 'pin', pin: p}); };
}
function awaitResult(payload){
  setState({orb: 'think', focus: true, head: 'Sending…', sub: `AED ${fmt(payload.payable ?? payload.amount)} to ${payload.payee || payload.merchant || 'them'}`});
  const since = Date.now() / 1000 - 1; let es, done = false;
  const finish = (ok, title, detail, ref) => {
    if (done) return; done = true; try { es && es.close(); } catch(_){}
    $('orb').hidden = false;
    setState({orb: 'small', head: '', focus: true, out: `<div class="result"><div class="tick ${ok ? '' : 'bad'}">${ok ? '✓' : '!'}</div>
      <div class="headline">${esc(title)}</div><p class="sub">${esc(detail)}</p>${ref ? `<div class="ref">Reference ${esc(ref)}</div>` : ''}</div>`});
    setTimeout(loadHome, 2500); setTimeout(loadHome, 22000);
    $('out').insertAdjacentHTML('beforeend', '<button class="confirm" id="again" style="margin-top:26px">Done</button>');
    $('again').onclick = () => setState({head: 'Anything else?', sub: 'Tell me what you would like to do', chips: true});
  };
  try { es = new EventSource('/events' + (AUTH ? '?auth=' + encodeURIComponent(AUTH) : '')); } catch(e){ return finish(false, 'Could not confirm', 'Check your balance.'); }
  es.onmessage = e => {
    let ev = {}; try { ev = JSON.parse(e.data); } catch(_){ return; }
    if (ev.t && ev.t < since) return;
    if (ev.kind === 'refused') return finish(false, 'That could not go through', ev.detail || 'It was declined. Nothing moved.');
    if (ev.kind === 'done'){
      let r = {}; try { r = JSON.parse(ev.detail); } catch(_){}
      const d = r.data || {};
      if (r.ok && PENDING_SPLIT && (payload.merchant || /merchant/.test(payload.kind || ''))){
        const who = PENDING_SPLIT.map(n => n.split(' ')[0]).join(' and '); PENDING_SPLIT = null;
        finish(true, `Paid AED ${fmt(d.amount ?? payload.payable ?? payload.amount)}`, `to ${payload.merchant || 'the merchant'} — now splitting it with ${who}…`, d.txnId);
        setTimeout(() => ask(`split it with ${who}`), 1400);
        return;
      }
      if (r.ok) finish(true, `Sent AED ${fmt(d.amount ?? payload.payable ?? payload.amount)}`, `to ${payload.payee || payload.merchant || 'them'}${d.serviceCharges != null ? ' · fee AED ' + fmt(d.serviceCharges) : ''}`, d.txnId);
      else finish(false, 'That did not go through', r.message || 'Nothing was taken from your wallet.');
    }
  };
  setTimeout(() => finish(false, 'No confirmation yet', 'I did not hear back. Check your balance before trying again — I will not retry on my own.'), 60000);
}


/* ── login: real OpenWallet login (mobile -> OTP -> PIN) ─────────────────────────────
   The server talks to the wallet's own login API and keeps the wallet token; this page
   only ever holds an opaque app token that names the logged-in customer. Every call to
   the assistant carries it, so balances, payees and payments are THAT customer's. */
let AUTH = null;
try { AUTH = sessionStorage.getItem('cx-auth'); } catch(e){}
const _fetch = window.fetch.bind(window);
window.fetch = (u, o = {}) => {
  if (AUTH && typeof u === 'string' && u.startsWith('/'))
    o = Object.assign({}, o, {headers: Object.assign({}, o.headers || {}, {'X-Cx-Auth': AUTH})});
  return _fetch(u, o).then(r => {
    if (r.status === 401 && typeof u === 'string' && !u.startsWith('/api/auth/')) showLogin('Your session has ended — please log in again.');
    return r;
  });
};
const A = {step: 'mobile', mobile: '', otp: '', pin: '', terms: false, tx: null, timer: null, left: 0, busy: false};
const KEYS = [1,2,3,4,5,6,7,8,9,'',0,'⌫'];
const ICON_FP = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"><path d="M12 11v3.5c0 2-1 3.5-2.5 4.5M8.5 9.6A3.5 3.5 0 0 1 15.5 11v2c0 2.5-.8 4.6-2 6M5.6 8A7 7 0 0 1 19 11v1.5c0 1.8-.3 3.5-.9 5M4.5 14.5c.3-1.3.5-2.6.5-3.5M17 4.6A9.5 9.5 0 0 0 3.6 7.3"/><path d="M14.4 20.8c.3-.4.6-.9.8-1.4" stroke="#e8262c"/><path d="M6.7 19.2c.4-.6.7-1.3 1-2" stroke="#1f8a4c"/></svg>';
const BUBBLE = '<svg width="120" height="110" viewBox="0 0 120 110"><defs><linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3d4ff"/><stop offset="1" stop-color="#9b6cf2"/></linearGradient><linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b38cf8"/><stop offset="1" stop-color="#8a55ee"/></linearGradient></defs><ellipse cx="74" cy="62" rx="40" ry="34" fill="url(#b2)"/><path d="M98 86l12 6-4-12z" fill="#8a55ee"/><ellipse cx="50" cy="44" rx="44" ry="38" fill="url(#b1)" opacity=".95"/><path d="M14 70l-6 12 14-6z" fill="#c9b3fb"/><circle cx="32" cy="44" r="5" fill="#fff" opacity=".8"/><circle cx="50" cy="44" r="5" fill="#fff" opacity=".9"/><circle cx="68" cy="44" r="5" fill="#fff"/></svg>';

function showLogin(msg){
  AUTH = null; try { sessionStorage.removeItem('cx-auth'); } catch(e){}
  Object.assign(A, {step: 'mobile', otp: '', pin: '', busy: false, err: msg || ''});
  $('auth').classList.remove('gone'); renderAuth();
}
function maskMobile(m){ return m.length >= 5 ? m.slice(0, 3) + '*'.repeat(Math.max(0, m.length - 5)) + m.slice(-2) : m; }
function renderAuth(){
  const au = $('auth'); au.classList.toggle('pin', A.step === 'pin');
  $('ahead').style.display = A.step === 'pin' ? 'none' : ''; $('abar').style.display = A.step === 'pin' ? 'none' : '';
  $('abar').firstElementChild.style.width = A.step === 'mobile' ? '20%' : '30%';
  const err = `<div class="aerr" id="aerr">${esc(A.err || '')}</div>`;
  if (A.step === 'mobile'){
    const ready = /^5\d{8}$/.test(A.mobile) && A.terms && !A.busy;
    $('abody').innerHTML = `<h1>Enter a valid mobile number</h1>
      <p class="lead">Please enter the mobile number that you registered with OpenWallet</p>
      <div class="mob"><span class="fl"><b></b><span><i></i><i></i><i></i></span></span><span class="cc">+971</span><span class="num">${esc(A.mobile)}</span></div>
      <div class="or">OR</div><button class="uae" id="uae">${ICON_FP}Login with UAE PASS</button>
      <div class="terms ${A.terms ? 'on' : ''}" id="terms"><span class="cb">${A.terms ? '✓' : ''}</span><span>I accept the <a>Terms and Conditions</a>, <a>KFS</a> and <a>Privacy Policy</a></span></div>
      ${err}<button class="go-btn ${ready ? 'on' : ''}" id="ago">${A.busy ? 'Please wait…' : 'Continue'}</button>`;
    $('terms').onclick = () => { A.terms = !A.terms; A.err = ''; renderAuth(); };
    $('uae').onclick = () => toast('UAE PASS is not available in this demo — use your mobile number');
    $('ago').onclick = () => ready && sendOtp();
  } else if (A.step === 'otp'){
    const ready = A.otp.length === 6 && !A.busy;
    $('abody').innerHTML = `<div class="bubble">${BUBBLE}</div><h1 style="margin-top:22px">Enter the 6-digit OTP sent to you</h1>
      <p class="lead">We have sent OTP to &nbsp;${esc(maskMobile(A.mobile))}</p>
      <div class="otp">${[0,1,2,3,4,5].map(i => `<i class="${i < A.otp.length ? 'f' : ''}"></i>`).join('')}</div>
      ${err}<button class="go-btn ${ready ? 'on' : ''}" id="ago">${A.busy ? 'Checking…' : 'Continue'}</button>
      <button class="ghost ${A.left ? '' : 'on'}" id="resend">${A.left ? `Resend OTP (in ${A.left}s)` : 'Resend OTP'}</button>`;
    $('ago').onclick = () => ready && verifyOtp();
    $('resend').onclick = () => !A.left && sendOtp(true);
  } else {
    $('abody').innerHTML = `<h1>Login with 4-digit PIN</h1>
      <div class="pinrow">${[0,1,2,3].map(i => `<i class="${i < A.pin.length ? 'f' : ''}"></i>`).join('')}</div>
      <div class="aerr" style="color:#fff;margin:14px 0 0">${esc(A.err || '')}</div>
      <div class="forgot" id="forgot">Forgot PIN?</div><div class="or">OR</div>
      <button class="uae" id="uae">${ICON_FP}Login with UAE PASS</button>`;
    $('forgot').onclick = () => toast('Reset your PIN in the OpenWallet app');
    $('uae').onclick = () => toast('UAE PASS is not available in this demo');
  }
  $('akeys').innerHTML = KEYS.map(k => k === '' ? '<span></span>' :
    `<button data-k="${k}" aria-label="${k === '⌫' ? 'Delete' : k}">${k === '⌫' ? '<svg width="34" height="26" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2h20a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H10L2 13z"/><path d="M15 8l9 10M24 8l-9 10"/></svg>' : k}</button>`).join('');
  $('akeys').querySelectorAll('[data-k]').forEach(b => b.onclick = () => key(b.dataset.k));
}
function key(k){
  if (A.busy) return;
  A.err = '';
  const field = A.step === 'mobile' ? 'mobile' : A.step === 'otp' ? 'otp' : 'pin';
  const max = {mobile: 9, otp: 6, pin: 4}[field];
  if (k === '⌫') A[field] = A[field].slice(0, -1);
  else if (/^\d$/.test(k) && A[field].length < max) A[field] += k;
  renderAuth();
  if (field === 'pin' && A.pin.length === 4) setTimeout(loginPin, 150);
}
document.addEventListener('keydown', e => {
  if ($('auth').classList.contains('gone')) return;
  if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('⌫');
  else if (e.key === 'Enter') ($('ago') && $('ago').classList.contains('on')) && $('ago').click();
});
$('aback').onclick = () => { if (A.step === 'otp'){ A.step = 'mobile'; A.otp = ''; A.err = ''; renderAuth(); } };
async function authCall(path, body){
  const r = await _fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let d = {}; try { d = await r.json(); } catch(e){}
  return Object.assign({ok: r.ok}, d);
}
async function sendOtp(again){
  A.busy = true; renderAuth();
  const d = await authCall('/api/auth/otp', {mobile: A.mobile});   // 9 digits, as the app sends
  A.busy = false;
  if (!d.ok || d.error){ A.err = d.error || 'Could not send the OTP. Try again.'; return renderAuth(); }
  A.tx = d.tx; A.step = 'otp'; A.otp = ''; A.left = 90;
  clearInterval(A.timer); A.timer = setInterval(() => { A.left = Math.max(0, A.left - 1); if (A.step === 'otp'){ const r = $('resend'); if (r){ r.textContent = A.left ? `Resend OTP (in ${A.left}s)` : 'Resend OTP'; r.classList.toggle('on', !A.left); } } if (!A.left) clearInterval(A.timer); }, 1000);
  if (again) toast('OTP sent again'); renderAuth();
}
async function verifyOtp(){
  A.busy = true; renderAuth();
  const d = await authCall('/api/auth/verify', {tx: A.tx, otp: A.otp});
  A.busy = false;
  if (!d.ok || d.error){ A.err = d.error || 'That OTP is not right.'; A.otp = ''; return renderAuth(); }
  A.tx = d.tx || A.tx; A.step = 'pin'; A.pin = ''; renderAuth();
}
async function loginPin(){
  A.busy = true;
  const d = await authCall('/api/auth/pin', {tx: A.tx, pin: A.pin});
  A.busy = false; A.pin = '';
  if (!d.ok || d.error || !d.auth){ A.err = d.error || 'That PIN is not right.'; return renderAuth(); }
  AUTH = d.auth; try { sessionStorage.setItem('cx-auth', AUTH); } catch(e){}
  $('auth').classList.add('gone');
  await login(); loadHome();
}

if (AUTH){ $('auth').classList.add('gone'); login().then(loadHome); } else { showLogin(); }
checkMic();
})();
</script>

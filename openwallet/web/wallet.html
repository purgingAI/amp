<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWallet Wallet · Alex</title>
<style>
:root{
  --red:#ef1a23; --red2:#e5472c; --orange:#f18918; --gold:#fbc007; --gold2:#ffe08a;
  --green:#28a745; --mint:#5ff0a8; --sky:#7fd1ff;
  --bg0:#05070d; --bg1:#0a0f1a;
  --line:rgba(255,255,255,.10); --ink:#eef3fb; --dim:#8b97ad; --faint:#5a6578;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1100px 680px at 50% 30%,#121a2b 0%,var(--bg1) 45%,var(--bg0) 100%);
  color:var(--ink);font:14px/1.5 var(--ui);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;
  background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(760px 520px at 50% 34%,#000 10%,transparent 76%);
  mask-image:radial-gradient(760px 520px at 50% 34%,#000 10%,transparent 76%)}

.top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 22px;z-index:50;background:linear-gradient(180deg,rgba(5,7,13,.92),rgba(5,7,13,0))}
.brand{font-weight:800;font-size:18px}
.brand span{background:linear-gradient(90deg,var(--red),var(--orange),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sep{width:1px;height:20px;background:var(--line)}
.sub{color:var(--dim);font-size:12.5px}
.live{margin-left:auto;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim);
  display:flex;align-items:center;gap:7px}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.live.on{color:var(--mint);border-color:rgba(95,240,168,.3)}
.live.on .dot{background:var(--mint);box-shadow:0 0 10px var(--mint)}

/* ---------- wallet card ---------- */
.wrap{position:fixed;inset:56px 0 0 0;display:grid;place-items:center;z-index:10}
.card{width:min(560px,92vw);border-radius:26px;padding:30px 32px 26px;position:relative;
  background:linear-gradient(145deg,rgba(239,26,35,.14),rgba(241,137,24,.10) 45%,rgba(251,192,7,.07));
  border:1px solid rgba(251,192,7,.22);
  box-shadow:0 40px 110px -40px rgba(241,137,24,.55), inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden;
  transition:transform .6s cubic-bezier(.2,.9,.2,1), box-shadow .6s}
.card.pop{transform:translateY(-6px) scale(1.015);
  box-shadow:0 50px 130px -40px rgba(95,240,168,.6),0 0 0 1px rgba(95,240,168,.3)}
/* sweeping sheen when money lands */
.card .sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%)}
.card.pop .sheen{animation:sheen 1.1s ease-out}
@keyframes sheen{0%{opacity:1;transform:translateX(-120%)}100%{opacity:0;transform:translateX(120%)}}

.who{display:flex;align-items:center;gap:13px}
.pav{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--sky),#4a90d9);color:#06172a}
.wname{font-weight:700;font-size:15.5px}
.wsub{color:var(--dim);font-size:12px;font-family:var(--mono)}
.chip{margin-left:auto;font:700 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;color:#2a1b00;
  background:linear-gradient(90deg,var(--gold2),var(--gold))}

.balwrap{margin:26px 0 6px;text-align:center}
.ccy{font:600 13px var(--mono);color:var(--gold2);letter-spacing:2px}
.bal{font-weight:800;font-size:60px;letter-spacing:-1.5px;line-height:1.05;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transition:filter .4s}
.card.pop .bal{filter:drop-shadow(0 0 26px rgba(95,240,168,.55))}
.blabel{color:var(--dim);font-size:12.5px;margin-top:4px}

.delta{position:absolute;right:30px;top:150px;transform:translate(0,10px);opacity:0;
  font:800 30px var(--ui);color:var(--mint);text-shadow:0 0 28px rgba(95,240,168,.75);
  pointer-events:none}
.delta.go{animation:rise 2.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{
  12%{opacity:1;transform:translate(0,-6px) scale(1.12)}
  70%{opacity:1;transform:translate(0,-48px) scale(1)}
  100%{opacity:0;transform:translate(0,-84px) scale(.95)}}

.rows{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.rows h5{margin:0 0 8px;font:700 10.5px var(--ui);letter-spacing:1.4px;text-transform:uppercase;
  color:var(--faint)}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tx:last-child{border-bottom:0}
.tx .i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px;
  background:rgba(95,240,168,.14);color:var(--mint)}
.tx .t{font-weight:600;font-size:13.5px}
.tx .s{color:var(--faint);font:500 11px var(--mono)}
.tx .a{font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums}
.tx.fresh{animation:slidein .6s cubic-bezier(.2,.9,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}}

/* ---------- the courier agent ---------- */
.agent{position:fixed;left:-260px;top:50%;margin-top:-56px;z-index:45;
  display:flex;align-items:center;gap:16px;pointer-events:none;opacity:0}
.agent.walk{animation:walkin 7.4s cubic-bezier(.22,.9,.25,1) forwards}
/* walks in from off-screen, halts clear of the card, hands over, leaves */
@keyframes walkin{
  0%  {opacity:0;left:-260px}
  12% {opacity:1}
  32% {left:calc(50% - 700px)}
  74% {left:calc(50% - 700px)}
  100%{opacity:0;left:calc(50% - 640px)}}
.bot{position:relative;width:86px;height:112px}
.bot .body{position:absolute;inset:18px 10px 0 10px;border-radius:22px 22px 16px 16px;
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06));
  border:1.5px solid rgba(251,192,7,.75);
  box-shadow:0 0 54px -6px rgba(241,137,24,.95), inset 0 1px 0 rgba(255,255,255,.3)}
.bot .visor{position:absolute;top:30px;left:20px;right:20px;height:26px;border-radius:13px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--gold));
  box-shadow:0 0 22px rgba(241,137,24,.9)}
.bot .visor::after{content:"";position:absolute;inset:6px 10px;border-radius:8px;
  background:rgba(255,255,255,.35);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{50%{transform:translateX(10px);opacity:.5}}
.bot .ant{position:absolute;top:0;left:50%;width:2px;height:20px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--gold),transparent)}
.bot .ant::after{content:"";position:absolute;top:-5px;left:-4px;width:10px;height:10px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);
  animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.35)}}
.bot .hover{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:72px;height:12px;border-radius:50%;background:rgba(241,137,24,.45);filter:blur(7px);
  animation:bob 1.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) scaleX(.8);opacity:.6}}
.agent.walk .bot{animation:bobup 1.5s ease-in-out infinite}
@keyframes bobup{50%{transform:translateY(-7px)}}

.bubble{position:relative;max-width:300px;padding:14px 18px;border-radius:16px 16px 16px 4px;
  background:rgba(10,15,26,.9);border:1px solid rgba(251,192,7,.35);
  box-shadow:0 20px 60px -24px rgba(241,137,24,.8);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;transform:translateY(8px) scale(.96)}
.agent.walk .bubble{animation:say .5s .9s cubic-bezier(.2,.9,.2,1) forwards,
                              unsay .5s 6.1s ease forwards}
@keyframes say{to{opacity:1;transform:none}}
@keyframes unsay{to{opacity:0;transform:translateY(-8px) scale(.97)}}
.bubble .l1{font-size:12px;color:var(--gold2);letter-spacing:.4px;text-transform:uppercase;
  font-weight:700}
.bubble .l2{font-size:15.5px;font-weight:700;margin-top:3px}
.bubble .l3{font-size:12.5px;color:var(--dim);margin-top:4px}
.bubble .from{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--line)}
.bubble .fav{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  font:800 10px var(--ui);color:#1a1206;background:linear-gradient(135deg,var(--gold),var(--orange))}
.bubble .fn{font-size:12px;color:var(--dim)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:35}
</style>
</head>
<body>

<div class="top">
  <div class="brand">Pay<span>10</span></div>
  <div class="sep"></div>
  <div class="sub">Wallet · Alex Morgan</div>
  <div class="live" id="live"><span class="dot"></span><span>waiting</span></div>
</div>

<canvas id="fx"></canvas>

<div class="wrap">
  <div class="card" id="card">
    <div class="sheen"></div>
    <div class="who">
      <div class="pav">VD</div>
      <div>
        <div class="wname">Alex Morgan</div>
        <div class="wsub">00S90H91PVPIOE4</div>
      </div>
      <div class="chip">active</div>
    </div>

    <div class="delta" id="delta">+0.00</div>

    <div class="balwrap">
      <div class="ccy">AED</div>
      <div class="bal" id="bal">0.00</div>
      <div class="blabel">available balance</div>
    </div>

    <div class="rows">
      <h5>recent</h5>
      <div id="txs"></div>
    </div>
  </div>
</div>

<div class="agent" id="agent">
  <div class="bot">
    <div class="ant"></div><div class="body"></div><div class="visor"></div><div class="hover"></div>
  </div>
  <div class="bubble">
    <div class="l1">payment delivered</div>
    <div class="l2" id="bAmt">20.00 AED</div>
    <div class="l3" id="bWhy">mandate mnd_adff2c3dad · green tier</div>
    <div class="from"><div class="fav">SU</div>
      <div class="fn">carried by <b style="color:var(--ink)">Sagar's agent</b> · agt_sagar</div></div>
  </div>
</div>

<script>
const BASE = new URL('.', location.href).pathname;   // works under / or under /payi/
const balEl = document.getElementById('bal'), card = document.getElementById('card'),
      txs = document.getElementById('txs'), agent = document.getElementById('agent');
let balance = 0;

// ---------- odometer ----------
const fmt = n => n.toLocaleString('en-AE', {minimumFractionDigits:2, maximumFractionDigits:2});
function countTo(to, ms){
  const from = balance, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    balEl.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else { balance = to; balEl.textContent = fmt(to); }
  })(t0);
}

// ---------- coin burst ----------
const fx = document.getElementById('fx'), fc = fx.getContext('2d');
function sizeFx(){ fx.width = innerWidth; fx.height = innerHeight; }
sizeFx(); addEventListener('resize', sizeFx);
let coins = [];
function burst(){
  const r = card.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + 150;
  for (let i = 0; i < 46; i++){
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4;
    const sp = 4 + Math.random() * 8;
    coins.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      life: 1, hue: Math.random()});
  }
}
(function fxLoop(){
  fc.clearRect(0, 0, fx.width, fx.height);
  coins = coins.filter(c => c.life > 0);
  coins.forEach(c => {
    c.vy += .28; c.x += c.vx; c.y += c.vy; c.rot += c.vr; c.life -= .011;
    fc.save(); fc.translate(c.x, c.y); fc.rotate(c.rot);
    fc.globalAlpha = Math.max(0, c.life);
    const g = fc.createLinearGradient(-c.r, -c.r, c.r, c.r);
    g.addColorStop(0, c.hue > .5 ? '#fbc007' : '#f18918');
    g.addColorStop(1, c.hue > .5 ? '#ffe08a' : '#ef1a23');
    fc.fillStyle = g;
    fc.beginPath(); fc.ellipse(0, 0, c.r, c.r * (.45 + Math.abs(Math.cos(c.rot)) * .55), 0, 0, 7);
    fc.fill(); fc.restore();
  });
  requestAnimationFrame(fxLoop);
})();

// ---------- the arrival ----------
function addTx(amount, txn, when){
  const row = document.createElement('div');
  row.className = 'tx fresh';
  row.innerHTML = '<div class="i">↓</div><div><div class="t">From Sagar Uniyal</div>'
    + '<div class="s"></div></div><div class="a"></div>';
  row.querySelector('.s').textContent = (when || new Date().toLocaleTimeString()) + ' · txn ' + txn;
  row.querySelector('.a').textContent = '+' + fmt(amount);
  txs.prepend(row);
  while (txs.children.length > 4) txs.lastChild.remove();
}

function received(d){
  const amt = parseFloat(d.amount);
  document.getElementById('bAmt').textContent = fmt(amt) + ' AED';
  document.getElementById('bWhy').textContent =
    'txn ' + d.txnId + ' · ' + (d.purpose || 'transfer').toLowerCase().replace(/_/g, ' ');

  agent.classList.remove('walk'); void agent.offsetWidth; agent.classList.add('walk');

  // the hand-off lands ~2.1s in, as the agent settles beside the card
  setTimeout(() => {
    card.classList.add('pop');
    const dl = document.getElementById('delta');
    dl.textContent = '+' + fmt(amt);
    dl.classList.remove('go'); void dl.offsetWidth; dl.classList.add('go');
    burst();
    countTo(balance + amt, 1400);
    addTx(amt, d.txnId);
    setTimeout(() => card.classList.remove('pop'), 1600);
  }, 2100);
}

// ---------- live ----------
const live = document.getElementById('live');
const es = new EventSource(BASE + 'events');
es.onopen  = () => { live.classList.add('on'); live.lastChild.textContent = 'listening'; };
es.onerror = () => { live.classList.remove('on'); live.lastChild.textContent = 'reconnecting'; };

let seen = new Set();
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  if (ev.kind === 'wallet.balances'){
    const m = /Alex\s+([\d.]+)/.exec(ev.detail);
    if (m && !balance) { balance = parseFloat(m[1]); balEl.textContent = fmt(balance); }
  }
  if (ev.kind === 'done'){
    let d = {}; try { d = JSON.parse(ev.detail); } catch(_){}
    if (d.ok && d.data && d.data.txnId && !seen.has(d.data.txnId)){
      seen.add(d.data.txnId);
      // A replayed 'done' is history, not an arrival — take the row and the balance,
      // but do not send the courier in for a payment that happened before we opened.
      if (ev.replay) addTx(parseFloat(d.data.amount), d.data.txnId);
      else received(d.data);
    }
  }
};

// opening balance, so the screen is never blank before the first payment
fetch(BASE + 'api/balance').then(r => r.json()).then(d => {
  if (d.alex != null && !balance){ balance = parseFloat(d.alex); balEl.textContent = fmt(balance); }
}).catch(() => {});
</script>
</body>
</html>
